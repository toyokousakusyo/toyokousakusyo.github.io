<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>アンケート結果｜キッズファクトリー</title>
<style>
body{margin:0;font-family:"Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;background:#fff8ec;color:#24272d}
header{background:#2f333a;color:#fff;padding:14px 18px;border-bottom:4px solid #ff7a1a;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
header h1{margin:0;font-size:20px}
header .n{margin-left:auto;font-weight:800}
header .n b{color:#ffd23f;font-size:26px}
button{font:inherit;font-weight:800;border:0;border-radius:99px;padding:8px 18px;cursor:pointer;background:#ff7a1a;color:#fff}
main{max-width:980px;margin:0 auto;padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){main{grid-template-columns:1fr}}
.box{background:#fff;border:3px solid #2f333a;border-radius:18px;padding:14px 16px}
.box h2{margin:0 0 10px;font-size:17px}
.row{display:grid;grid-template-columns:9em 1fr 3.5em;gap:8px;align-items:center;font-size:14px;margin:5px 0}
.bar{height:16px;background:#f0e8da;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb347,#ff7a1a)}
.row span:last-child{text-align:right;font-weight:800}
.wide{grid-column:1/-1}
.big{font-size:40px;font-weight:800;color:#ff7a1a}
.cm{border-bottom:1px dashed #ddd;padding:8px 0;font-size:14px}
.cm small{color:#999;margin-right:8px}
#msg{padding:30px;text-align:center;font-weight:800}


.per{font-size:13px;display:flex;align-items:center;gap:4px}.per input{font:inherit;padding:3px 6px;border-radius:6px;border:0}.ex{font-size:12px;color:#ffd23f;width:100%}
@media print{.per input{border:0;background:none;color:#000;padding:0}.ex{color:#666}}
.pdate{display:none}
@page{size:A4;margin:12mm}
@media print{
 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 body{background:#fff}
 header{background:#fff;color:#000;border-bottom:3px solid #ff7a1a;padding:0 0 6px}
 header button{display:none}
 header .n b{color:#ff7a1a}
 .pdate{display:block;width:100%;font-size:12px;color:#444}
 main{max-width:none;padding:10px 0;gap:10px;grid-template-columns:1fr 1fr}
 .box{break-inside:avoid;page-break-inside:avoid;border-width:2px;padding:10px 12px}
 .wide{break-inside:auto}
 .cm{break-inside:avoid}
 #msg{display:none!important}
}
</style>
</head>
<body>
<header><h1>📮 キッズファクトリー アンケート結果</h1><button id="re">🔄 更新</button><button id="csv">⬇ CSV</button><button id="pr">🖨 印刷</button><label class="per">集計期間 <input type="date" id="dFrom" value="2026-11-28"> 〜 <input type="date" id="dTo"></label><span class="ex" id="ex"></span><span class="n">回答 <b id="tot">-</b> 件</span><div class="pdate" id="pdate"></div></header>
<div id="msg">よみこみ中…</div>
<main id="main"></main>
<script>
const DB='https://toyo-game-default-rtdb.asia-southeast1.firebasedatabase.app';
let rows=[],ALL=[];
function ms(v,end){if(!v)return null;const t=new Date(v+'T'+(end?'23:59:59.999':'00:00:00')+'+09:00').getTime();return isNaN(t)?null:t}
function applyF(){const f=ms(document.getElementById('dFrom').value,0),t=ms(document.getElementById('dTo').value,1);rows=ALL.filter(r=>(f==null||r.t>=f)&&(t==null||r.t<=t));const n=ALL.length-rows.length;document.getElementById('ex').textContent=n>0?'期間外の '+n+' 件（テスト回答など）は集計に入れていません':'';render()}
const ORDER={
 fun:['キーホルダーづくり','アイシングクッキー','ガチャガチャ','あそび場','マルシェ','ゲーム','工場見学'],
 game:['TOYODASH','パイプ大作戦','TOYOカート','ドキドキ面接','東洋ファイター','とよとよ','TOYOBLAST','あそんでない'],
 star:['5','4','3','2'], again:['ぜったい くる！','たぶん','わからない'],
 know:['チラシ','学校','Instagram','YouTube','ホームページ','知人・友人','通りがかり','その他'],
 age:['未就学','小学1〜3年','小学4〜6年','中学生','高校生','おとな','中学生以上']};
const LBL={star:{'5':'😆 さいこう','4':'😊 たのしい','3':'🙂 ふつう','2':'😐 いまいち'}};
const TITLE={fun:'たのしかったもの（複数）',game:'いちばん好きなゲーム',star:'満足度',again:'また来たい？',know:'何で知ったか（複数）',age:'年れい'};
function count(k){const c={};ORDER[k].forEach(x=>c[x]=0);rows.forEach(r=>{let v=r[k];if(v==null||v==='')return;(Array.isArray(v)?v:[v]).forEach(x=>{x=String(x);c[x]=(c[x]||0)+1})});return c}
function box(k){const c=count(k),mx=Math.max(1,...Object.values(c)),n=rows.filter(r=>r[k]&&r[k].length!==0).length;
 return '<div class="box"><h2>'+TITLE[k]+' <small style="color:#999">（'+n+'人）</small></h2>'+Object.keys(c).map(x=>'<div class="row"><span>'+((LBL[k]||{})[x]||x)+'</span><div class="bar"><i style="width:'+(c[x]/mx*100)+'%"></i></div><span>'+c[x]+'</span></div>').join('')+'</div>'}
function render(){
 document.getElementById('tot').textContent=rows.length;
 if(!rows.length){document.getElementById('msg').textContent='まだ回答はありません。';document.getElementById('main').innerHTML='';return}
 document.getElementById('msg').style.display='none';
 const st=rows.filter(r=>r.star).map(r=>+r.star),avg=st.length?(st.reduce((a,b)=>a+b,0)/st.length):0;
 const cms=rows.filter(r=>r.text).sort((a,b)=>b.t-a.t);
 document.getElementById('main').innerHTML=
  '<div class="box"><h2>満足度の平均（5点満点）</h2><div class="big">'+avg.toFixed(2)+'</div></div>'+box('star')+box('fun')+box('game')+box('again')+box('know')+box('age')+
  '<div class="box wide"><h2>ひとこと（'+cms.length+'件）</h2>'+(cms.map(r=>'<div class="cm"><small>'+new Date(r.t).toLocaleString('ja-JP')+'</small>'+String(r.text).replace(/[<>&]/g,s=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[s]))+'</div>').join('')||'なし')+'</div>';
}
async function load(){
 const m=document.getElementById('msg');m.style.display='';m.textContent='よみこみ中…';
 try{const r=await fetch(DB+'/survey.json');if(!r.ok)throw new Error(r.status);const d=await r.json()||{};ALL=Object.values(d);applyF()}
 catch(e){m.textContent='よみこめませんでした（'+e.message+'）。Firebaseのルールで survey の読み取りが許可されているか確認してください。'}
}
document.getElementById('re').onclick=load;document.getElementById('dFrom').onchange=document.getElementById('dTo').onchange=applyF;document.getElementById('pr').onclick=()=>{document.getElementById('pdate').textContent='集計日時：'+new Date().toLocaleString('ja-JP')+'　／　期間：'+(document.getElementById('dFrom').value||'はじめ')+' 〜 '+(document.getElementById('dTo').value||'いま')+'　／　回答 '+rows.length+' 件';window.print()};window.addEventListener('beforeprint',()=>{document.getElementById('pdate').textContent='集計日時：'+new Date().toLocaleString('ja-JP')+'　／　期間：'+(document.getElementById('dFrom').value||'はじめ')+' 〜 '+(document.getElementById('dTo').value||'いま')+'　／　回答 '+rows.length+' 件'});
document.getElementById('csv').onclick=()=>{
 const H=['日時','満足度','たのしかったもの','好きなゲーム','また来たい','知ったきっかけ','学年','ひとこと'];
 const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
 const L=[H.map(q).join(',')].concat(rows.sort((a,b)=>a.t-b.t).map(r=>[new Date(r.t).toLocaleString('ja-JP'),r.star,(r.fun||[]).join(' / '),r.game,r.again,(r.know||[]).join(' / '),[].concat(r.age||[]).join(' / '),r.text].map(q).join(',')));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+L.join('\r\n')],{type:'text/csv'}));a.download='kids_factory_enquete.csv';a.click();
};
load();
</script>
</body>
</html>
